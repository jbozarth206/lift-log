<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="referrer" content="no-referrer">
<title>Lift Log · Connecting MyChart</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#e9ecf2;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:340px} h1{font-size:22px;margin:0 0 8px} p{color:#8a93a6;line-height:1.45} a{color:#ff6b35;font-weight:600}
  .spin{width:34px;height:34px;border:3px solid #262c38;border-top-color:#ff6b35;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin" id="spin"></div><h1 id="t">Connecting MyChart…</h1><p id="m">Finishing secure sign-in.</p></div>
<script src="mychart.config.js?v=7"></script>
<script src="mychart.js?v=7"></script>
<script>
(async () => {
  const q = location.search;
  // drop the one-time code from the address bar/history right away
  history.replaceState(null, '', location.pathname);
  const r = await MyChart.handleCallback(q);
  if (r.ok) { location.replace('./?mychart=connected'); return; }
  document.getElementById('spin').remove();
  document.getElementById('t').textContent = 'Could not connect MyChart';
  const msg = r.error === 'state-mismatch'
    ? 'This sign-in was started somewhere else (for example Safari vs. the Home Screen app). Open Lift Log the same way you started and tap Connect MyChart again.'
    : r.error;
  document.getElementById('m').innerHTML = '';
  document.getElementById('m').append(msg, document.createElement('br'), document.createElement('br'));
  const a = document.createElement('a'); a.href = './?mychart=error'; a.textContent = 'Back to Lift Log'; document.getElementById('m').append(a);
})();
</script>
</body>
</html>
